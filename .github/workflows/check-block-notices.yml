name: Check public block notices
on:
  pull_request:
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check public notice pages
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const site = readFileSync("out/blocked/index.html", "utf8");
          const app = readFileSync("out/blocked/app/index.html", "utf8");
          assert.match(site, /This website is blocked/);
          assert.match(app, /This application is blocked/);
          assert.match(site, /IT helpdesk/);
          assert.match(app, /IT helpdesk/);
          assert.match(site, /noindex, nofollow/);
          assert.match(app, /noindex, nofollow/);
          JS
